version: "3"
services:
  runner:
    restart: always
    build: .
    #image: registry.<host>.su/testsofdepartmenttesting/runner:latest
    # network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/app
      - /opt/allure-data:/allure-data
    ports:
      - 3000:3000
    environment:
      - HOST_REPORT_DIR=/opt/runner
      - NODE_ENV=production
      - DISPATCH_TOKEN=${DISPATCH_TOKEN}

  mongo:
    image: mongo:4.4-bionic
    restart: always
    environment:
      MONGO_INITDB_DATABASE: test
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - 27017:27017

  chrome:
    restart: always
    shm_size: 1gb
    # image: selenium/node-chrome:4.0.0-beta-1-prerelease-20201208
    build: ./chrome
    volumes:
      - /dev/shm:/dev/shm
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_BROWSER_ARGS_ACCEPT_LANG=--accept-lang=ru

  firefox:
    restart: always
    image: selenium/node-firefox:4.45.0
    volumes:
      - /dev/shm:/dev/shm
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

  selenium-hub:
    restart: always
    image: selenium/hub:4.17.0-20240123
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
